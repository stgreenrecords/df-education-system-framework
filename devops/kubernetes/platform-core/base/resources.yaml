apiVersion: v1
kind: Namespace
metadata:
  name: platform-core
  labels:
    deployment.darkfactory.io/ownership: country-sovereign
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-core
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-core
      annotations:
        deployment.darkfactory.io/configuration-boundary: provider-overrides-only
        deployment.darkfactory.io/secret-source: external-secret-sync-required
    spec:
      serviceAccountName: platform-core
      containers:
        - name: platform-core
          image: education-system-framework/platform-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-core-runtime-config
                optional: true
            - secretRef:
                name: platform-core-runtime-secrets
          readinessProbe:
            httpGet:
              path: /platform/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /platform/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-core
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-core
  ports:
    - name: http
      port: 80
      targetPort: http

