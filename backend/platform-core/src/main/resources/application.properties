spring.application.name=education-system-framework

spring.datasource.url=${EDU_DB_URL:jdbc:postgresql://localhost:5432/education_framework}
spring.datasource.username=${EDU_DB_USERNAME:education_framework}
spring.datasource.password=${EDU_DB_PASSWORD:education_framework}
spring.datasource.hikari.maximum-pool-size=${EDU_DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${EDU_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${EDU_DB_POOL_CONNECTION_TIMEOUT_MS:30000}

spring.flyway.enabled=${EDU_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

edu.tenant.country-code=${EDU_TENANT_COUNTRY_CODE:ZZ}
edu.tenant.display-name=${EDU_TENANT_DISPLAY_NAME:Default Sovereign Deployment}
edu.tenant.timezone=${EDU_TENANT_TIMEZONE:UTC}
edu.tenant.locale=${EDU_TENANT_LOCALE:en}

edu.translation.default-language=${EDU_TRANSLATION_DEFAULT_LANGUAGE:en}
edu.translation.global-fallback-language=${EDU_TRANSLATION_GLOBAL_FALLBACK_LANGUAGE:en}
edu.translation.default-namespace=${EDU_TRANSLATION_DEFAULT_NAMESPACE:default}
edu.translation.cache-ttl=${EDU_TRANSLATION_CACHE_TTL:PT10M}

edu.auth.jwt-secret=${EDU_AUTH_JWT_SECRET:}
edu.auth.token-ttl=${EDU_AUTH_TOKEN_TTL:PT15M}
edu.auth.bootstrap-admin-username=${EDU_AUTH_BOOTSTRAP_ADMIN_USERNAME:}
edu.auth.bootstrap-admin-password=${EDU_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
edu.auth.bootstrap-admin-display-name=${EDU_AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:Bootstrap Administrator}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
